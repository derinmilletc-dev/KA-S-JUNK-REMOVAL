<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Track your request | Kais Junk Remove</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2421;--paper:#F6F3EE;--line:#E2DCD0;--muted:#565D58;--orange:#F26B1D;--deep:#C2500F;--tint:#FCE6D8;--green:#1E8E4E}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:14px 20px;font:700 18px 'Bricolage Grotesque',sans-serif}header span{color:var(--orange)}
main{max-width:460px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}
h1{font:700 26px 'Bricolage Grotesque',sans-serif;margin:0 0 4px;letter-spacing:-.01em}
.muted{color:var(--muted);font-size:14px}
ol{list-style:none;margin:18px 0 0;padding:0}
li{display:flex;gap:12px;padding:0 0 18px;position:relative;color:var(--muted)}
li:not(:last-child):before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
li i{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:700}
li.done{color:var(--ink)}li.done i{background:var(--green);border-color:var(--green);color:#fff}li.done:not(:last-child):before{background:var(--green)}
li.now i{border-color:var(--orange);background:var(--tint);color:var(--deep);box-shadow:0 0 0 4px #F26B1D22}li.now{color:var(--ink);font-weight:600}
li small{display:block;font-weight:400;color:var(--muted)}
.price{background:var(--paper);border-radius:12px;padding:12px 14px;margin-top:4px}.price b{font:700 24px 'Bricolage Grotesque',sans-serif}
.btn{display:block;text-align:center;background:var(--orange);color:#fff;text-decoration:none;font-weight:600;border-radius:12px;padding:13px}
.btn.ok{background:var(--green);border:0;width:100%;font:inherit;font-weight:600;cursor:pointer;margin-top:14px}.share{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.share h2{font:700 18px 'Bricolage Grotesque',sans-serif;margin:0 0 4px}.share .row{display:flex;gap:8px;margin-top:12px}.share .row a,.share .row button{flex:1;text-align:center;border-radius:10px;padding:11px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink)}.share .row a.g{background:var(--green);border-color:var(--green);color:#fff}
.rev{background:linear-gradient(135deg,#1F2421,#2E3531);color:#fff;border-radius:18px;padding:20px;margin-bottom:14px}.rev h2{font:700 20px 'Bricolage Grotesque',sans-serif;margin:0 0 4px}.rev p{margin:0;color:#ffffffb3;font-size:14px}.rev .stars{color:#F6B73C;font-size:26px;letter-spacing:3px;margin:8px 0}.rev a{display:block;text-align:center;background:var(--orange);color:#fff;text-decoration:none;font-weight:600;border-radius:12px;padding:13px;margin-top:12px}
.btn:hover{background:var(--deep)}.err{color:#B42318}
</style></head><body>
<header>Kais <span>Junk Remove</span></header>
<main><div class="card" id="box"><p class="muted" id="state">Loading…</p></div>
<div id="photos"></div>
<div id="review"></div>
<div id="share"></div>
<a class="btn" id="wa" href="https://wa.me/14074462534" target="_blank" rel="noopener">Message us on WhatsApp</a>
<p class="muted" style="text-align:center;margin-top:14px">This private page updates by itself. Open +1 (407) 446-2534 anytime.</p></main>
<script src="portal/config.js"></script>
<script>
(function(){
var K=window.KJ||{},tok=(new URLSearchParams(location.search).get('t')||'').toLowerCase().replace(/[^a-f0-9]/g,'');
var box=document.getElementById('box');
var STEPS=[['new','Request received','We have your details and photos.'],['quoted','Quote ready','Your price is below.'],['booked','Pickup scheduled','We will see you on the day.'],['done','Completed','Space back. Thank you!']];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pick(s){if(!s)return '';try{var d=new Date(String(s).replace(' ','T').replace(/Z$/,'')+'Z');return d.toLocaleString('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch(e){return ''}}
function fmt(d){return new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function review(l){var el=document.getElementById('review');
 if(!l.review_url||!/^https:\/\//.test(l.review_url)){el.innerHTML='';return}
 el.innerHTML='<div class="rev"><div class="stars" aria-hidden="true">★★★★★</div><h2>How did we do?</h2><p>A quick Google review helps a small local team more than you think. Takes 30 seconds.</p><a id="rv" target="_blank" rel="noopener" href="'+esc(l.review_url)+'">Leave a Google review</a></div>';
 document.getElementById('rv').addEventListener('click',function(){fetch(K.SUPABASE_URL+'/rest/v1/rpc/mark_review_click',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json',apikey:K.SUPABASE_ANON_KEY,Authorization:'Bearer '+K.SUPABASE_ANON_KEY},body:JSON.stringify({p_token:tok})}).catch(function(){})})}
function share(l){var el=document.getElementById('share');
 if(!l.share_code||!(l.closed||l.status==='booked'||l.status==='done')){el.innerHTML='';return}
 var u=new URL('./?rc='+l.share_code,location.href).href,each=Number(l.credit_each||0);
 el.innerHTML='<div class="share"><h2>Know someone who needs a clear-out?</h2><p class="muted" style="margin:0">Share your link.'+(each>0?' You get <b>$'+each+' credit</b> for every friend whose job is completed.':'')+'</p>'
 +(each>0&&l.friends_done>0?'<p class="muted" style="margin:8px 0 0">Friends helped: <b>'+l.friends_done+'</b> · Credit earned: <b>$'+Number(l.credit)+'</b></p>':'')
 +'<div class="row"><a class="g" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent('Need junk removed in Florida? Kais Junk Remove did a great job for me. Quote by photo: '+u)+'">Share on WhatsApp</a><button type="button" id="cl">Copy link</button></div></div>';
 document.getElementById('cl').onclick=function(){navigator.clipboard.writeText(u).then(function(){document.getElementById('cl').textContent='Copied'})}}
var upN=0;
function resize(f){return new Promise(function(ok,no){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var m=1400,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?ok(b):no()},'image/jpeg',.82)};im.onerror=no;im.src=u})}
function photos(l){var el=document.getElementById('photos');if(l.closed||['new','quoted','booked'].indexOf(l.status)<0){el.innerHTML='';return}if(el.firstChild)return;
 el.innerHTML='<div class="card"><h2 style="font:700 20px \'Bricolage Grotesque\',sans-serif;margin:0 0 4px">Add photos</h2><p class="muted" style="margin:0 0 10px">More photos help us give an accurate quote. Up to 12.</p><label class="btn" style="cursor:pointer">📷 Choose or take photos<input id="pf" type="file" accept="image/*" multiple hidden></label><p class="muted" id="pm" style="margin:10px 0 0"></p></div>';
 document.getElementById('pf').onchange=function(){var fs=Array.prototype.slice.call(this.files||[]).slice(0,12),pm=document.getElementById('pm');if(!fs.length)return;pm.textContent='Uploading…';var bad=0;
  fs.reduce(function(p,f,i){return p.then(function(){return resize(f).then(function(b){return fetch(K.SUPABASE_URL+'/storage/v1/object/lead-photos/'+tok+'/'+Date.now()+'-'+i+'.jpg',{method:'POST',headers:{apikey:K.SUPABASE_ANON_KEY,Authorization:'Bearer '+K.SUPABASE_ANON_KEY,'Content-Type':'image/jpeg'},body:b})}).then(function(r){if(r.ok)upN++;else bad++}).catch(function(){bad++})})},Promise.resolve())
  .then(function(){pm.textContent=(upN?'✓ '+upN+' photo'+(upN>1?'s':'')+' sent. ':'')+(bad?bad+' could not be sent (limit reached or bad file).':'Thank you!')})}}
function msg(t,bad){box.innerHTML='<p class="muted'+(bad?' err':'')+'">'+esc(t)+'</p>'}
function draw(l){
 if(l.closed){box.innerHTML='<h1>All done</h1><p class="muted">#'+esc(l.ref)+'. Service confirmed and payment received. This tracking link is now closed. Thank you for choosing Kais Junk Remove!</p>'+(l.paid?'<a class="btn" target="_blank" href="receipt.html?t='+tok+'">View receipt</a>':'');document.getElementById('wa').hidden=true;review(l);share(l);return}
 if(l.status==='lost'){box.innerHTML='<h1>Request closed</h1><p class="muted">#'+esc(l.ref)+'. This request is closed. Message us if you would like to start again.</p>';return}
 var at=STEPS.findIndex(function(s){return s[0]===l.status});
 box.innerHTML='<h1>'+(l.first_name?'Hi '+esc(l.first_name)+'!':'Your request')+'</h1><p class="muted">Reference #'+esc(l.ref)+' · updated '+fmt(l.updated_at)+'</p>'
 +(l.summary?'<p class="muted">'+esc(l.summary)+'</p>':'')+(l.scheduled_at&&l.status!=='done'?'<div class="price" style="margin-top:8px"><span class="muted">Pickup</span><br><b style="font-size:20px">'+esc(pick(l.scheduled_at))+'</b><br><span class="muted">Florida time</span></div>':'')
 +(l.price!=null?'<div class="price"><span class="muted">Your quote</span><br><b>$'+Number(l.price).toFixed(2).replace(/\.00$/,'')+'</b></div>':'')
 +(l.crew_status&&l.status!=='done'?'<div class="price" style="margin-top:8px"><b style="font-size:18px">'+({enroute:'🚚 Our crew is on the way',working:'🛠 Our crew is working on it',finished:'✅ Job finished'}[l.crew_status]||'')+'</b></div>':'')
 +(l.deposit_amount>0?'<div class="price" style="margin-top:8px"><span class="muted">Deposit</span><br><b style="font-size:20px">$'+Number(l.deposit_amount).toFixed(2).replace(/\.00$/,'')+'</b> '+(l.deposit_paid?'<span style="color:var(--green);font-weight:600">✓ received</span>':'<span class="muted">due to confirm your slot</span>')+(!l.deposit_paid&&l.deposit_note?'<br><span class="muted">'+esc(l.deposit_note)+'</span>':'')+'</div>':'')
 +(l.amount_due!=null?'<div class="price" style="margin-top:8px;border:2px solid var(--green)"><span class="muted">Amount due</span><br><b style="font-size:26px">$'+Number(l.amount_due).toFixed(2).replace(/\.00$/,'')+'</b>'+(l.pay_note?'<br><span class="muted">'+esc(l.pay_note)+'</span>':'')+(l.paid_claimed?'<p style="margin:8px 0 0;color:var(--green);font-weight:600">✓ Thanks! We will confirm your payment shortly.</p>':'<button class="btn ok" id="cp" type="button" style="margin-top:10px">I have paid</button>')+'</div>':'')
 +(l.status==='quoted'&&l.price!=null&&!l.quote_accepted?'<button class="btn ok" id="aq" type="button" style="margin-top:10px">Accept this quote</button>':'')+(l.status==='quoted'&&l.quote_accepted?'<p style="margin:10px 0 0;color:var(--green);font-weight:600">✓ Quote accepted. We will confirm a pickup time shortly.</p>':'')
 +(l.confirmed?'<p class="muted" style="margin-top:12px">✓ You confirmed the service. Waiting for payment confirmation from us.</p>':'')+(l.can_confirm?'<button class="btn ok" id="cf" type="button">Confirm the service was completed</button>':'')+'<ol>'+STEPS.map(function(s,i){var c=i<at||(i===at&&l.status==='done')?'done':i===at?'now':'';return '<li class="'+c+'"><i>'+(c==='done'?'✓':i+1)+'</i><span>'+s[1]+'<small>'+(c?s[2]:'')+'</small></span></li>'}).join('')+'</ol>';
}
function load(first){
 if(!K.SUPABASE_URL||tok.length<24){if(first)msg('This tracking link is not valid.',true);return}
 fetch(K.SUPABASE_URL+'/rest/v1/rpc/track_lead',{method:'POST',headers:{'Content-Type':'application/json',apikey:K.SUPABASE_ANON_KEY,Authorization:'Bearer '+K.SUPABASE_ANON_KEY},body:JSON.stringify({p_token:tok})})
 .then(function(r){return r.json()}).then(function(d){if(d&&d[0]){draw(d[0]);photos(d[0]);review(d[0]);share(d[0])}else if(first)msg('We could not find this request. Check the link or message us.',true)})
 .catch(function(){if(first)msg('Could not load. Try again in a moment.',true)});
}
document.addEventListener('click',function(e){if(e.target&&e.target.id==='cp'){e.target.disabled=true;fetch(K.SUPABASE_URL+'/rest/v1/rpc/claim_paid',{method:'POST',headers:{'Content-Type':'application/json',apikey:K.SUPABASE_ANON_KEY,Authorization:'Bearer '+K.SUPABASE_ANON_KEY},body:JSON.stringify({p_token:tok})}).then(function(){load(false)});return}if(e.target&&e.target.id==='aq'){e.target.disabled=true;fetch(K.SUPABASE_URL+'/rest/v1/rpc/accept_quote',{method:'POST',headers:{'Content-Type':'application/json',apikey:K.SUPABASE_ANON_KEY,Authorization:'Bearer '+K.SUPABASE_ANON_KEY},body:JSON.stringify({p_token:tok})}).then(function(){load(false)});return}if(!e.target||e.target.id!=='cf')return;e.target.disabled=true;
 fetch(K.SUPABASE_URL+'/rest/v1/rpc/confirm_service',{method:'POST',headers:{'Content-Type':'application/json',apikey:K.SUPABASE_ANON_KEY,Authorization:'Bearer '+K.SUPABASE_ANON_KEY},body:JSON.stringify({p_token:tok})}).then(function(){load(false)})});
load(true);setInterval(function(){if(!document.hidden)load(false)},30000);
})();
</script></body></html>
